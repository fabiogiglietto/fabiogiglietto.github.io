# TEMPORARY — workspace attribution probe. Deleted once verified.
name: WIF workspace probe
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_FEDERATION_RULE_ID:  ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID:     ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID:  ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID:        ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/jwt
    steps:
      - name: Fetch OIDC token
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > /tmp/jwt
      - name: Call Claude and report the billed workspace
        run: |
          echo "workspace_id sent = $ANTHROPIC_WORKSPACE_ID"
          pip install --quiet anthropic
          python - <<'PY'
          import anthropic
          r = anthropic.Anthropic().messages.with_raw_response.create(
              model="claude-opus-5", max_tokens=32,
              messages=[{"role": "user", "content": "Say hello in five words."}],
          )
          print("BILLED WORKSPACE =", r.headers.get("anthropic-workspace-id"))
          PY
