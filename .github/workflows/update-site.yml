name: Update Website Data

on:
  # Triggered by research-radio in the pipeline chain (see PIPELINE.md)
  repository_dispatch:
    types: [pipeline-tick]
  schedule:
    # Daily fallback at 06:00 UTC in case a dispatch is missed
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual triggering

# Avoid overlapping runs (daily cron + dispatch both committing/pushing)
concurrency:
  group: update-site
  cancel-in-progress: false

# contents:write is required by the auto-commit step. Declaring any permissions
# block drops every scope not listed here, so it must stay enumerated.
# id-token:write lets the job mint the GitHub OIDC token that the Anthropic SDK
# exchanges for a short-lived access token (Workload Identity Federation) — no
# ANTHROPIC_API_KEY secret is stored in this repository.
permissions:
  contents: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent hanging workflows
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Update core data (daily)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          SKIP_ABOUT_GENERATION: 'true'
          SKIP_TEACHING_GENERATION: 'true'
        run: |
          npm run collect
          
      - name: Update bio (weekly on Monday)
        if: github.event.schedule && github.event_name == 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Workload Identity Federation for the bio reviewer. No secret is
          # stored: the SDK exchanges the OIDC token fetched below. Leave
          # ANTHROPIC_API_KEY unset — it outranks federation in the SDK's
          # credential precedence and would silently shadow it.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # Required when the federation rule is scoped to more than one
          # workspace: without it the token exchange 401s. Harmless when the
          # rule resolves to a single workspace, and empty if the var is unset.
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc-jwt
        run: |
          if [ $(date +%u) -eq 1 ]; then
            echo "Monday detected - updating bio"
            # Fetched here rather than at job start: the GitHub OIDC token
            # expires ~5 minutes after issuance and the collect step above runs
            # long. Non-fatal — the reviewer degrades to "skipped" and the bio
            # still publishes if this fails.
            if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ANTHROPIC_FEDERATION_RULE_ID" ]; then
              curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
                | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE" \
                || echo "OIDC token fetch failed - bio reviewer will be skipped"
            else
              echo "Federation not configured - bio reviewer will be skipped"
            fi
            npm run generate-about
          else
            echo "Not Monday - skipping bio update"
          fi
          
      - name: Update teaching (monthly on 1st)
        if: github.event.schedule && github.event_name == 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ $(date +%d) -eq 01 ]; then
            echo "First of month detected - updating teaching"
            npm run generate-teaching
          else
            echo "Not first of month - skipping teaching update"
          fi
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'Website Data Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add .
          
          # Check if there are any changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "📊 No data changes detected - skipping commit"
            exit 0
          fi
          
          # Build commit message based on what was updated
          UPDATES=""
          CURRENT_DAY=$(date +%u)  # 1=Monday, 7=Sunday
          CURRENT_DATE=$(date +%d)
          
          # Always include core data
          UPDATES="core data"
          
          # Add weekly updates (Mondays)
          if [ "$CURRENT_DAY" -eq 1 ]; then
            UPDATES="$UPDATES, AI biography"
          fi
          
          # Add monthly updates (1st of month)  
          if [ "$CURRENT_DATE" = "01" ]; then
            UPDATES="$UPDATES, teaching data"
          fi
          
          # Create commit
          git commit -m "🤖 Auto-update: $UPDATES ($(date +%Y-%m-%d))" -m "
          Automated daily website data collection including:
          - Publications from multiple academic sources
          - Social media activity and insights  
          - Reading list from research papers
          - Web mentions and citations
          $([ "$CURRENT_DAY" -eq 1 ] && echo "- AI-generated biography refresh")
          $([ "$CURRENT_DATE" = "01" ] && echo "- Teaching data update")
          
          🤖 Generated with [GitHub Actions](https://github.com/fabiogiglietto/fabiogiglietto.github.io/actions)
          "
          
          echo "📤 Pushing updates to repository..."
          # Resilient push: another writer (concurrent dispatch, daily cron, or
          # external commit) may advance main between our checkout and push.
          # Rebase our fresh commit onto the latest main and retry. The data
          # files are regenerated wholesale, so they conflict on a plain rebase;
          # `-X theirs` keeps THIS run's freshly collected data (in a rebase
          # "theirs" = the commit being replayed). Non-conflicting upstream
          # changes (e.g. a schedule run's weekly bio) are preserved.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Pushed on attempt $attempt"
              exit 0
            fi
            echo "⚠️ Push rejected (attempt $attempt) — rebasing onto latest origin/main..."
            if ! git pull --rebase -X theirs origin main; then
              echo "❌ Rebase failed irrecoverably — aborting"
              git rebase --abort || true
              exit 1
            fi
            sleep $((RANDOM % 5 + attempt))
          done
          echo "❌ Push failed after 5 attempts"
          exit 1

      # End of the chain: fg-zettelkasten's `update` leg — themes, notes
      # (with the real podcast link) and the Slack digest.
      - name: Trigger downstream pipeline (fg-zettelkasten finalize)
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          repository: fabiogiglietto/fg-zettelkasten
          event-type: pipeline-finalize
      # Pipeline observability — alert on any failed run. No-ops until a
      # SLACK_WEBHOOK_URL (or SLACK_BOT_TOKEN + vars.OPS_SLACK_CHANNEL)
      # is configured in this repo's settings.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERT_CHANNEL: ${{ vars.OPS_SLACK_CHANNEL }}
          ALERT_TEXT: ":rotating_light: ${{ github.repository }} / ${{ github.workflow }} failed (${{ github.event_name }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          # Ops alerts belong in the channel OPS_SLACK_CHANNEL names, so the
          # explicit channel wins over the webhook. The webhook is bound to
          # #toread at creation and cannot be redirected from here; it stays
          # only as a last resort for a repo with no bot token.
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_ALERT_CHANNEL" ]; then
            resp=$(jq -n --arg ch "$SLACK_ALERT_CHANNEL" --arg text "$ALERT_TEXT" '{channel: $ch, text: $text}' \
              | curl -s -X POST -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json' \
                  -d @- https://slack.com/api/chat.postMessage)
            # chat.postMessage answers HTTP 200 with {"ok":false} for a channel the
            # bot is not in, so curl -f cannot see it and `|| true` would bury it.
            [ "$(jq -r '.ok' <<<"$resp")" = "true" ] \
              || echo "::error::Slack rejected the failure alert: $resp"
          elif [ -n "$SLACK_WEBHOOK_URL" ]; then
            jq -n --arg text "$ALERT_TEXT" '{text: $text}' \
              | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL" \
              || echo "::error::Slack webhook rejected the failure alert"
          else
            echo "No Slack credentials configured — skipping failure alert"
          fi
