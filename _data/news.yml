  content: >-
    The cultural and societal implications of generative AI are under scrutiny
    in several newly highlighted papers. These works explore themes ranging from
    the production of 'AI slop' and 'degenerative AI' in China's viral
    short-form video ecosystem to audience perceptions of trustworthiness
    regarding task-specific AI disclosures.
