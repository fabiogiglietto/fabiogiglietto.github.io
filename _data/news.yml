- date: '2026-07-08'
  content: >-
    Comparative research across six democratically weakened nations sheds light
    on how generative AI is weaponized for digital authoritarianism and
    propaganda. The study provides crucial insights into the evolving landscape
    of state-sponsored information control.
  url: https://doi.org/10.1177/20539517251410064
