- date: '2026-10-06'
  content: >-
    A newly highlighted study explores how "data" is defined and strategically
    contested under the EU's Digital Services Act researcher access provision.
    The research reveals that platform companies systematically narrow data
    definitions to aggregated datasets in their submissions, contrasting with
    the broader interpretations intended by regulatory frameworks.
