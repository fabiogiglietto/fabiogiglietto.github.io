- date: '2026-08-20'
  content: >-
    CheckFirst and the European Fact-Checking Standards Network (EFCSN) have
    launched a survey targeting the European information integrity community.
    The initiative seeks input from researchers, fact-checkers, civil society
    organizations, and investigative units to identify current operational
    challenges and determine which resources would most effectively support
    their work.
