- date: '2026-10-25'
  content: >-
    Platform governance of climate misinformation faces significant policy
    enforcement gaps, according to a study by V. Kuznetsova. Analyzing Meta,
    YouTube, TikTok, and X/Twitter, the research reveals that most major
    platforms rely on soft interventions like labeling and demotion rather than
    strict policy enforcement or content removal.
