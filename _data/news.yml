  content: >-
    A newly published study by Törnberg and Uitermark (2026) analyzes the
    structural shift from the 2010s 'platform society' to an 'AI society,'
    arguing that generative AI monopolies rely on cognitive lock-in and massive
    capital expenditure rather than standard platform network effects.
