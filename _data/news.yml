- date: '2026-07-22'
  content: >-
    A new co-authored study published in Information, Communication & Society
    examines partisan community dynamics within pro-Bolsonaro Facebook networks.
    The longitudinal analysis, co-authored by Giada Marino, Bruna Paroni, and
    Fabio Giglietto, investigates affective engagement to understand how
    partisan groups maintain online cohesion and generate engagement over time.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-31'
  content: >-
    Recent research published in Science Advances sheds light on the consumption
    and impact of digital misinformation. The study, 'Untrustworthy sources on
    Facebook and Instagram in 2020: Concentrated exposure but no attitudinal
    effects' by Olivier Bergeron-Boutin et al., reveals that while exposure to
    unreliable information is highly concentrated among specific user groups, it
    does not significantly alter overall political attitudes.
  url: https://doi.org/10.1126/sciadv.adz6502
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-08-07'
  content: >-
    The emerging cultural critiques of generative artificial intelligence are
    explored in a new paper by Idil Galip and Ludmila Lupinacci. Titled
    'Degenerative AI: AI slop, brainrot, and the gimmick of generative culture,'
    the work investigates how the proliferation of low-quality, automated
    content shapes modern digital ecosystems and audience perceptions.
  url: https://doi.org/10.1177/13675494261468638
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    The structural limitations of platform-mediated research are critically
    examined in a new paper by Zoë Natalia Cullen, Nicole B. Ellison, and Irene
    V. Pasquetto. Titled 'Seeing like an API: Platform-mediated research and the
    politics of access,' the study explores how platform-controlled interfaces
    shape the methodologies and boundaries of academic inquiry.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
    - Mastodon
    - BlueSky
  toread: true
