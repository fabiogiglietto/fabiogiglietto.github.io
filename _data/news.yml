- date: '2026-07-31'
  content: >-
    A major study published in Science Advances investigates exposure to
    untrustworthy sources on Facebook and Instagram during the 2020 US election.
    The research finds that while exposure to misinformation was highly
    concentrated among a small group of users, it had no detectable effects on
    their political attitudes.
  url: https://aoir.social/@fabiogiglietto/117013532175857545
