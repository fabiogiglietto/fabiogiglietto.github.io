- date: '2026-07-27'
  content: >-
    The societal impact of generative artificial intelligence and deepfakes is
    the focus of several newly highlighted studies. Key publications investigate
    audience perceptions of task-specific AI disclosures, how deepfake
    interpretations shape political discourse in countries like Kenya, and the
    broader risks of generative propaganda under digital authoritarian regimes.
  url: https://doi.org/10.1080/21670811.2026.2703599
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
    Navigating the increasingly restricted space of platform-mediated social
    research is the subject of several methodological updates. Recent work
    addresses the constraints of working with platform data in 'clean room'
    environments, critiques the politics of API access, and introduces
    open-access sampling tools such as TubeStats and TokStats for YouTube and
    TikTok research.
  url: https://doi.org/10.25358/openscience-15825
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-24'
  content: >-
    Recent literature explores the multifaceted drivers of political and
    affective polarization. Highlighted papers examine globally equitable
    frameworks for polarization research, how different measurement
    methodologies can alter findings on media partisanship, and the role media
    narratives play in magnifying the perceived impact of digital election
    interference.
  url: >-
    https://scholar.google.com/scholar?q=Toward%20an%20integrated%20and%20globally%20equitable%20understanding%20of%20political%20polarization
  platforms:
    - Mastodon
    - BlueSky
  toread: true
