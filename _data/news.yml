- date: '2026-07-14'
  content: >-
    The ongoing struggle for independent social media research is the focus of a
    new theoretical framework analyzing the 'politics of access.' The authors
    examine how platform-mediated environments and API constraints dictate what
    researchers can see and study.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
