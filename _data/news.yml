- date: '2026-07-22'
  content: >-
    A newly published longitudinal study in Information, Communication & Society
    investigates partisan community dynamics and affective engagement within
    pro-Bolsonaro Facebook networks. Co-authored with Giada Marino and Bruna
    Paroni, the paper offers empirical insights into how political communities
    build and sustain engagement over time.
