  content: >-
    A new research framework by Richard Jean So and Hoyt Long explores the
    social and cultural life of low-quality, mass-produced AI-generated
    content—often referred to as 'AI slop.' Published in Big Data & Society, the
    paper proposes a theoretical approach to studying the proliferation and
    cultural impact of synthetic media.
