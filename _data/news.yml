- date: '2026-07-31'
  content: >-
    New research explores the complex dynamics of political polarization, media
    ecosystem networks, and election trust. Featured studies analyze the
    ideological mapping of news sharing, the concentrated exposure to
    untrustworthy sources on Facebook and Instagram, and the potential of
    narrative monitoring to counter disinformation.
  url: https://aoir.social/@fabiogiglietto/117013532175857545
