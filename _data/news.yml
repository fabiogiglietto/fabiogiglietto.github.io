- date: '2026-07-22'
  content: >-
    A newly published longitudinal study in Information, Communication & Society
    examines affective engagement within pro-Bolsonaro Facebook networks.
    Co-authored with Giada Marino and Bruna Paroni, the paper tracks partisan
    community dynamics to reveal how emotional connections sustain political
    networks over time.
