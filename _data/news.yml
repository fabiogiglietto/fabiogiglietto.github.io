- date: '2026-07-22'
  content: >-
    A new study co-authored by Giada Marino, Bruna Paroni, and Fabio Giglietto
    examines partisan community dynamics on social media. Published in
    Information, Communication & Society, the longitudinal analysis tracks
    affective engagement within pro-Bolsonaro Facebook networks to understand
    how political polarization and community bonding manifest online.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-31'
  content: >-
    Published in Science Advances, a new study by Olivier Bergeron-Boutin and
    colleagues explores user exposure to untrustworthy sources on Facebook and
    Instagram during the 2020 US election. The research reveals that while
    exposure to misinformation is highly concentrated among a small group of
    users, it does not appear to have measurable effects on their political
    attitudes.
  url: https://doi.org/10.1126/sciadv.adz6502
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    The politics of platform-mediated research are under the microscope in a new
    paper by Zoë Natalia Cullen, Nicole B. Ellison, and Irene V. Pasquetto.
    Entitled "Seeing like an API," the work critically analyzes how API access
    and platform-controlled environments shape the boundaries and methodologies
    of contemporary social media research.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-08-07'
  content: >-
    Emerging concepts of "degenerative AI" and "AI slop" are conceptualized in a
    new journal article by Idil Galip and Ludmila Lupinacci. The paper
    investigates the rise of generative culture, examining how low-quality,
    automated content and "brainrot" memes function as systemic gimmicks within
    modern digital attention economies.
  url: https://doi.org/10.1177/13675494261468638
  platforms:
    - Mastodon
    - BlueSky
  toread: true
