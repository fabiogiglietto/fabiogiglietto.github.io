- date: '2026-11-18'
  content: >-
    A major study analyzing over 180 million Facebook users examines political
    unfriending behaviors, finding that while overall unfriending remains rare,
    users disproportionately disconnect from those across the political divide
    during major political events like elections. The study by Malhotra et al.
    highlights that strong partisans and conservative users show higher rates of
    cross-ideological unfriending.
