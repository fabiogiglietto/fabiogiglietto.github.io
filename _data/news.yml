- date: '2026-07-22'
  content: >-
    New longitudinal research published in Information, Communication & Society
    examines partisan community dynamics by analyzing affective engagement
    within pro-Bolsonaro Facebook networks. Co-authored by Giada Marino, Bruna
    Paroni, and Fabio Giglietto, the study maps the evolution of emotional ties
    and network structures in political spaces online.
