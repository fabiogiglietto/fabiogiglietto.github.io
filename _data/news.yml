- date: '2026-07-18'
  content: >-
    Critical insights into democratic resilience are explored in a new paper
    analyzing how informational pathways and fake news shape public confidence
    in elections. The study offers a detailed framework for understanding the
    mechanisms that degrade trust in democratic outcomes.
  url: https://doi.org/10.1080/17457289.2026.2701896
