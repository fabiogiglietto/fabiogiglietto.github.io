- date: '2026-07-12'
  content: >-
    Can conversational AI change minds? Recent research by Johannes Kotz et al.
    demonstrates that conversational AI can significantly shift beliefs and
    policy support among skeptics on contested societal issues, pointing to new
    dynamics in digital persuasion and public discourse.
  url: https://aoir.social/@fabiogiglietto/116905830369384920
