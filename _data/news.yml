- date: '2026-10-03'
  content: >-
    Tracking content moderation outcomes across the 2016, 2020, and 2024 U.S.
    presidential elections, a study by Rogers and Koronska (2026) finds an
    overall decline in problematic content performance on Facebook, alongside a
    notable concentration of remaining high-reach borderline material among
    right-wing sources.
