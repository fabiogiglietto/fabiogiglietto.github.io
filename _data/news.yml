- date: '2026-11-12'
  content: >-
    A decade-long study of Facebook posts from Norwegian political parties sheds
    light on how emotional tone influences social media sharing. Published in
    Social Media + Society, the research shows that while positive sentiment was
    more common overall, negative posts consistently generated higher
    engagement, particularly for challenger parties.
