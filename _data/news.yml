- date: '2026-09-24'
  content: >-
    A new open-access venue for academic research, Disinformation: An
    Interdisciplinary Journal, has been officially launched by Sage. Serving on
    the editorial board, the initiative offers a diamond open-access platform
    with no APCs to investigate platform dynamics, information integrity, and
    the socio-political framing of disinformation globally.
