- date: '2026-07-18'
  content: >-
    How does online media shape trust in democratic institutions? A new study
    analyzes the specific informational pathways through which misinformation
    compromises public confidence in election results.
  url: https://doi.org/10.1080/17457289.2026.2701896
  platforms:
