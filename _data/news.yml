- date: '2026-10-02'
  content: >-
    Commercial generative AI models are reshaping online extremist imagery
    rather than eliminating it, an experimental pipeline study shows. While
    automated filters sanitize explicit hate symbols during image synthesis, the
    underlying ideological rhetoric and visual cues often persist in regenerated
    outputs.
