- date: '2026-08-07'
  content: >-
    The cultural impact of generative AI comes under scrutiny in a new paper by
    Idil Galip and Ludmila Lupinacci. The authors conceptualize 'degenerative
    AI' to explore issues surrounding 'AI slop' and the evolving gimmickry of
    generative online culture.
  url: https://aoir.social/@fabiogiglietto/117053581448335909
