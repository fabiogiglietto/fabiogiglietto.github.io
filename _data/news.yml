    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
    Academics face increasingly complex hurdles when navigating social media API
    restrictions. A new paper by Axel Bruns and Laura Vodden addresses these
    contemporary challenges, specifically examining the methodological and
    practical issues of conducting research within platform-mediated, secure
    'clean room' environments.
  url: https://doi.org/10.25358/openscience-15825
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    The long-term effects of generative artificial intelligence on civic spaces
    are analyzed in a new study exploring the future of digital public squares.
    Led by Beth Goldberg, the research outlines critical structural
    interventions necessary to safeguard public discourse and mitigate automated
    propaganda.
  url: https://doi.org/10.1177/26339137261459441
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-04'
  content: >-
    In a newly published analysis, researchers Lorenzo Mosca and Fred Paxton
    investigate how the label of 'fake news' is strategically deployed within
    Italian newspapers. The study reveals how media outlets use the term as a
    rhetorical weapon for political delegitimization and selective
    amplification.
  url: https://doi.org/10.1177/02673231261458935
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-02'
  content: >-
    Crowd-sourced moderation systems like X's Community Notes may systematically
    undermoderate polarizing content, according to a recent study published in
    Science Advances. Authors Paul Bouchaud and Pedro Ramaciotti analyze these
    systemic design risks and warn of their potential consequences for
    democratic electoral processes.
  url: https://doi.org/10.1126/sciadv.aee6932
