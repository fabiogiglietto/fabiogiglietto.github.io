- date: '2026-08-13'
  content: >-
    Exploring the emerging phenomenon of low-quality digital content, a new
    study by Jiaru Tang and co-authors investigates the production of viral,
    AI-generated short videos in China, shedding light on the economic and
    technological drivers behind the rise of 'AI slop.'
  url: https://doi.org/10.1007/s00146-026-03254-9
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-31'
  content: >-
    New research published in Science Advances investigates the impact of
    untrustworthy sources on Facebook and Instagram during the 2020 election
    cycle. The multi-authored study reveals that while exposure to untrustworthy
    content was highly concentrated among specific audiences, it did not result
    in measurable attitudinal changes.
  url: https://doi.org/10.1126/sciadv.adz6502
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-22'
  content: >-
    A new longitudinal study co-authored by Giada Marino, Bruna Paroni, and
    Fabio Giglietto maps the dynamics of partisan online communities. The paper
    analyzes affective engagement over time within pro-Bolsonaro Facebook
    networks to understand how political identities are sustained online.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
    Addressing the growing constraints on independent academic inquiry,
    researchers Axel Bruns and Laura Vodden have published an analysis detailing
    the operational and methodological challenges of analyzing social media data
    within platform-controlled 'clean room' environments.
  url: https://doi.org/10.25358/openscience-15825
  platforms:
    - Mastodon
    - BlueSky
