  content: >-
    A recent study by Kuznetsova (2026) published in Platforms & Society
    examines platform governance of climate misinformation across Meta, YouTube,
    TikTok, and X. The research highlights significant gaps between platforms'
    public communications and their formal policies, noting that most rely on
    soft interventions like labeling and demotion rather than content removal.
