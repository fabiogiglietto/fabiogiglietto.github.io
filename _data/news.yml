  content: >-
    The European Fact-Checking Standards Network (EFCSN) and CheckFirst have
    launched a survey targeted at the information integrity community. The
    initiative gathers evidence from researchers, fact-checkers, and civil
    society organizations to pinpoint the primary challenges and resource needs
    in the fight against disinformation.
