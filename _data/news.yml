  content: >-
    Findings published in *The Journal of Politics* analyze cross-ideological
    unfriending patterns on Facebook using a dataset of over 180 million users.
    The study reveals that while unfriending is relatively rare overall,
    users—particularly strong partisans—disproportionately sever social ties
    across political lines during high-stakes events like major elections.
