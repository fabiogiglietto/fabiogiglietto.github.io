- date: '2026-07-22'
  content: >-
    A newly published longitudinal study in *Information, Communication &
    Society*, co-authored with Giada Marino and Bruna Paroni, explores the
    dynamics of partisan online communities. The research analyzes affective
    engagement patterns within pro-Bolsonaro Facebook networks over time,
    offering new insights into how digital partisan spaces sustain engagement.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-31'
  content: >-
    A major study published in *Science Advances* examines the real-world impact
    of untrustworthy content on social media. Analyzing user exposure on
    Facebook and Instagram during 2020, the researchers found that while
    exposure to untrustworthy sources was highly concentrated among a small
    subset of users, it did not produce measurable shifts in political
    attitudes.
  url: https://doi.org/10.1126/sciadv.adz6502
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
    The methodological and political challenges of modern platform research are
    the focus of recent literature on data access. Featured studies address both
    the political landscape of API-mediated academic research and the practical
    hurdles that researchers face when analyzing platform data inside secure
    clean room environments.
  url: https://doi.org/10.25358/openscience-15825
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-27'
  content: >-
    How audiences perceive and interact with generative AI remains a critical
    focus of contemporary communication research. Recent scholarly publications
    investigate this space, analyzing how audiences interpret task-specific AI
    disclosures, the impact of deepfakes on public discourse, and the strategic
    use of generative AI for digital authoritarianism and propaganda.
  url: https://doi.org/10.1080/21670811.2026.2703599
  platforms:
    - Mastodon
    - BlueSky
  toread: true
