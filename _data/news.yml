  content: >-
    Platform governance of climate misinformation faces significant policy gaps,
    according to new research examining Meta, YouTube, TikTok, and X. The study
    reveals that most social networks favor soft interventions such as demotion
    and labeling over strict content removal, with TikTok standing out as the
    only platform enforcing explicit rules against climate misrepresentation.
