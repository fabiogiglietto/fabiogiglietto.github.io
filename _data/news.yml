- date: '2026-10-02'
  content: >-
    New research by F. Crichton and G. Torres explores how commercial generative
    AI systems transform far-right propaganda. By converting extremist imagery
    into text prompts and regenerating them, the study illustrates how AI models
    sanitize explicit hateful markers while maintaining underlying ideological
    bias through visual aesthetics.
