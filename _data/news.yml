- date: '2026-10-06'
  content: >-
    An examination of researcher access provisions under the EU Digital Services
    Act by T. Annabell highlights how the term 'data' remains strategically
    contested between regulatory intentions and commercial implementations.
    Published in Media, Technology and Governance, the research illustrates
    platform strategies to narrow compliance to pre-aggregated datasets.
