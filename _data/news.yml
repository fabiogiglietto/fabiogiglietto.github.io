  content: >-
    New methodology from Iannucci et al. reframes coordinated inauthentic
    behavior detection as a problem of statistical detectability rather than
    mere co-activity. The study critiques traditional network projection and
    clustering techniques, demonstrating how standard approaches often identify
    false clusters of co-activated accounts regardless of genuine underlying
    coordination.
