- date: '2026-11-18'
  content: >-
    A landmark study examining political unfriending on Facebook across more
    than 180 million users has been published in *The Journal of Politics*. The
    research provides unprecedented empirical evidence on how political
    disagreement drives social network pruning on digital platforms.
  url: https://doi.org/10.1086/744929
