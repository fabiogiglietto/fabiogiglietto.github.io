- date: '2026-07-27'
  content: >-
    Recent scholarship extensively addresses the intersections of generative AI,
    public trust, and digital disinformation. Key papers examine how audiences
    interpret task-specific AI disclosures, the impact of deepfakes on political
    discourse in emerging democracies, the role of conversational AI in shifting
    public beliefs, and the rise of digital authoritarianism.
  url: https://aoir.social/@fabiogiglietto/116992652423710021
