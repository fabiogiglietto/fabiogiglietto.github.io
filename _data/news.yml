- date: '2026-07-22'
  content: >-
    A newly published study examines partisan community dynamics on Facebook.
    Co-authored with Giada Marino and Bruna Paroni, the research utilizes a
    longitudinal analysis to explore how affective engagement evolved within
    pro-Bolsonaro networks, offering key insights into digital political
    mobilization.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
    Navigating the complexities of secure data sharing, a new paper by Axel
    Bruns and Laura Vodden addresses the technical and methodological challenges
    of analyzing social media platform data within restricted clean room
    environments.
  url: https://doi.org/10.25358/openscience-15825
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    The politics of academic access to social media platform data is the focus
    of a new study by Zoë Natalia Cullen, Nicole B. Ellison, and Irene V.
    Pasquetto. The authors critique how platform-mediated research is
    increasingly shaped and constrained by corporate infrastructure and
    interfaces.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-12'
  content: >-
    Emerging research demonstrates that conversational AI has the capacity to
    significantly alter beliefs and policy support, even among skeptics. The
    study, led by Johannes Kotz, highlights the persuasive influence of
    interactive AI models across contested societal debates.
  url: https://doi.org/10.31234/osf.io/7szrn_v1
  platforms:
    - Mastodon
