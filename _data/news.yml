- date: '2026-10-09'
  content: >-
    A recent study published in *Dialogues on Digital Society* by Törnberg and
    Uitermark (2026) investigates the structural transition from the 'platform
    society' to an 'AI society.' The authors contend that generative AI
    monopolies are sustained through cognitive lock-in and corporate capital
    expenditures rather than the traditional network effects of 2010s social
    platforms.
