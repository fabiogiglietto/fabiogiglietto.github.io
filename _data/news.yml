    A novel streaming pipeline for pre-peak misinformation triage was presented
    at the 35th ACM International Conference on Information and Knowledge
    Management (CIKM). The methodology successfully predicts narrative virality
    approximately 23 hours before maximum spread occurs on social streams.
  url: https://doi.org/10.1145/3799682.3840688
