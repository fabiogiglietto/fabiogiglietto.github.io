- date: '2026-07-22'
  content: >-
    A new longitudinal study tracking partisan community dynamics has been
    published, analyzing affective engagement within pro-Bolsonaro Facebook
    networks. Co-authored by Fabio Giglietto, Giada Marino, and Bruna Paroni,
    the paper details how emotional attachment and partisan alignment evolve
    within digital spaces.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
