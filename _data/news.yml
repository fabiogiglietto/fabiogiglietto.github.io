- date: '2026-07-22'
  content: >-
    A newly co-authored study published in *Information, Communication &
    Society* examines partisan community dynamics on social media. Utilizing
    longitudinal analysis, the research maps affective engagement within
    pro-Bolsonaro Facebook networks to reveal how emotional connections sustain
    political echo chambers over time.
