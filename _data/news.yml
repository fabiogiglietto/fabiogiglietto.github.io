- date: '2026-11-08'
  content: >-
    Predicting narrative virality hours before peak spread occurs is the focus
    of a new streaming pipeline developed for pre-peak misinformation triage
    (Altoe et al., CIKM 2026). The approach clusters semantically similar posts
    into evolving narratives and normalizes claims using language models to
    prioritize candidates for fact-checkers up to 23 hours in advance.
