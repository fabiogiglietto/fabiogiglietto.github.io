- date: '2026-07-18'
  content: >-
    The methodology and politics of social media research are undergoing
    significant shifts as platform data access tightens. Newly published
    analyses from Axel Bruns & Laura Vodden and Zoë Natalia Cullen et al.
    critique the logistical and political challenges of conducting independent
    research within platform-controlled 'clean rooms' and API-mediated
    environments.
