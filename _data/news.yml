- date: '2026-07-31'
  content: >-
    Featured in *Science Advances*, a landmark study investigates public
    exposure to untrustworthy information on Facebook and Instagram during the
    2020 US election. The findings highlight that while exposure to partisan and
    untrustworthy sources remains highly concentrated among a small group of
    users, it has no measurable effects on political attitudes.
  url: https://doi.org/10.1126/sciadv.adz6502
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-27'
  content: >-
    As generative AI becomes more integrated into daily communication, a new
    investigation explores how audiences perceive automated content. The study
    evaluates the effectiveness of task-specific AI disclosures on audience
    trust, revealing complex perceptions that challenge simplistic transparency
    mandates.
  url: https://doi.org/10.1080/21670811.2026.2703599
  platforms:
