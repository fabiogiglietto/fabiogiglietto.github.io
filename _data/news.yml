- date: '2026-07-22'
  content: >-
    Newly published research in Science Advances examines the impact of
    untrustworthy information sources on Facebook and Instagram during the 2020
    election cycle. The study reveals that while exposure to questionable
    content was highly concentrated among specific user groups, it produced no
    measurable effects on overall political attitudes.
