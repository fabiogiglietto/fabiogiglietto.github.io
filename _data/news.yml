  content: >-
    Disclosing the persuasive intent of AI chatbots can significantly reduce
    their ability to influence users, according to a new pre-print study by
    Adrian Rauchfleisch and Andreas Jungherr that advocates for meaningful
    transparency standards in conversational AI.
