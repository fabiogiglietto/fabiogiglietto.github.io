- date: '2026-07-31'
  content: >-
    How audiences interpret alternative media and misleading content remains a
    critical area of inquiry. Recent research by Olivier Bergeron-Boutin et al.
    reveals that while exposure to untrustworthy sources on Facebook and
    Instagram is highly concentrated, it shows no direct attitudinal effects,
    while separate work by Patrícia Rossini and colleagues examines how
    informational pathways and misinformation directly undermine trust in
    democratic election results.
  url: https://aoir.social/@fabiogiglietto/117013532175857545
