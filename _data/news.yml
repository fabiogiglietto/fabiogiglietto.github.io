- date: '2026-08-15'
  content: >-
    New research from Adrian Rauchfleisch and Andreas Jungherr addresses the
    need for meaningful transparency in conversational AI, demonstrating that
    explicitly disclosing the persuasive intent of AI chatbots significantly
    reduces their ability to persuade users.
