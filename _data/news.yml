- date: '2026-07-22'
  content: >-
    How do partisan communities maintain engagement over time? A new
    longitudinal study published in Information, Communication & Society
    examines affective engagement within pro-Bolsonaro Facebook networks,
    co-authored by Giada Marino, Bruna Paroni, and Fabio Giglietto.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-31'
  content: >-
    Published in Science Advances, a new study by Olivier Bergeron-Boutin and
    colleagues investigates user exposure to untrustworthy sources on Facebook
    and Instagram during the 2020 US election, revealing that while exposure was
    highly concentrated, it did not result in measurable changes in political
    attitudes.
  url: https://doi.org/10.1126/sciadv.adz6502
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    Addressing critical questions of academic data access, a highlighted paper
    in Big Data & Society explores the politics of platform-mediated research,
    analyzing how API infrastructure shapes the boundaries and methodology of
    social media scholarship.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-12'
  content: >-
    Skeptics of contested societal issues may be more receptive to persuasion
    than previously thought. A new working paper by Johannes Kotz and co-authors
    demonstrates how interactions with conversational AI systems can
    successfully shift beliefs and influence policy support.
  url: https://doi.org/10.31234/osf.io/7szrn_v1
  platforms:
    - Mastodon
    - BlueSky
