  content: >-
    Exposure to untrustworthy digital sources may be highly concentrated but
    does not necessarily shift political attitudes, according to a landmark
    study published in Science Advances. Analyzing 2020 Facebook and Instagram
    data, researchers found no significant attitudinal changes despite
    concentrated user exposure to unreliable content.
