- date: '2026-07-22'
  content: >-
    A newly published longitudinal study in Information, Communication and
    Society explores affective engagement within pro-Bolsonaro Facebook
    networks. Co-authored by Fabio Giglietto alongside Giada Marino and Bruna
    Paroni, the paper offers new insights into measuring partisan community
    dynamics in highly polarized social media environments.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-31'
  content: >-
    Exposure to untrustworthy information sources on Facebook and Instagram
    during the 2020 election was highly concentrated among a small subset of
    users, according to a recent paper in Science Advances. Crucially, the
    researchers found no evidence that this exposure resulted in shifts in
    political attitudes.
  url: https://doi.org/10.1126/sciadv.adz6502
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-27'
  content: >-
    A new study in Digital Journalism examines how audiences perceive the
    trustworthiness of task-specific generative AI disclosures. The research
    investigates whether explicit labels regarding AI-generated content alter
    public trust and credibility perceptions.
  url: https://doi.org/10.1080/21670811.2026.2703599
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    Examining the shifting landscape of social media research, a new study in
    Big Data & Society delves into the political and technical constraints of
    platform APIs. The work outlines how platform-mediated access shapes the
    questions researchers can ask and the methodologies they can employ.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-08-07'
  content: >-
    A newly published paper introduces the concepts of 'degenerative AI' and 'AI
    slop' to conceptualize the cultural impact of low-effort generative content.
    The authors argue that these manifestations of generative culture operate
    largely as gimmicks rather than transformative communication tools.
  url: https://doi.org/10.1177/13675494261468638
  platforms:
    - Mastodon
    - BlueSky
  toread: true
