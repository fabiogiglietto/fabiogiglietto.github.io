- date: '2026-10-06'
  content: >-
    New research by Annabell (2026) in *Media, Technology and Governance*
    analyzes how platform companies and regulators define 'data' under the EU's
    Digital Services Act researcher access provision. The paper reveals a
    strategic narrowing of the term by tech corporations toward aggregated
    datasets compared to broader interpretations intended by EU lawmakers.
