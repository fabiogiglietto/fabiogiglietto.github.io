- date: '2026-07-22'
  content: >-
    A newly published longitudinal study in Information, Communication & Society
    examines affective engagement within pro-Bolsonaro Facebook networks in
    Brazil. Co-authored by Fabio Giglietto alongside Giada Marino and Bruna
    Paroni, the paper measures partisan community dynamics to reveal how
    emotional attachment drives online political mobilization.
