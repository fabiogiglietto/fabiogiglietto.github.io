- date: '2026-07-31'
  content: >-
    Does exposure to untrustworthy news on social media actually alter political
    attitudes? A major study analyzing 2020 Facebook and Instagram data reveals
    that while exposure to untrustworthy sources remains highly concentrated
    among specific groups, it shows no measurable effects on user attitudes.
  url: https://aoir.social/@fabiogiglietto/117013532175857545
