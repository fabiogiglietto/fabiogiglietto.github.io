- date: '2026-10-03'
  content: >-
    Tracking Facebook content moderation dynamics across the 2016, 2020, and
    2024 U.S. presidential elections, a study by Richard Rogers and Katarzyna
    Koronska investigates the performance of borderline material. While overall
    engagement with problematic content decreased significantly by 2024,
    high-performing borderline material became overwhelmingly concentrated among
    right-wing sources.
