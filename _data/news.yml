  content: >-
    A practical guide published in Social Science Computer Review demonstrates
    how open-weight large language models can be instructed to perform automated
    content analysis. The methodology incorporates a 'Judge agent' to resolve
    coding disagreements, achieving inter-coder reliability comparable to expert
    human coders.
