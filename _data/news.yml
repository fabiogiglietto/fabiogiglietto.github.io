- date: '2026-07-22'
  content: >-
    A newly published longitudinal study, co-authored with Giada Marino and
    Bruna Paroni, investigates partisan community dynamics on Facebook. The
    research analyzes affective engagement within pro-Bolsonaro networks over
    time, providing fresh insights into how online political communities form
    and sustain emotional connections.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
    Understanding the erosion of democratic trust is the focus of a recent study
    by Patrícia Rossini, Camila Mont'Alverne, and Antonis Kalogeropoulos. The
    paper examines the direct impact of various informational pathways and
    misinformation on public confidence in election outcomes.
  url: https://doi.org/10.1080/17457289.2026.2701896
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    Research constraints in the platform era are critically analyzed in a new
    paper exploring the politics of API access. Scholars Zoë Natalia Cullen,
    Nicole B. Ellison, and Irene V. Pasquetto examine the conceptual and
    practical challenges of platform-mediated research and how API boundaries
    shape academic knowledge.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    As generative artificial intelligence continues to evolve, a new study by
    Beth Goldberg and co-authors assesses its long-term effects on digital
    public squares. The paper explores the challenges and structural shifts that
    AI-driven synthetic media presents to online public communication and
    democratic systems.
  url: https://doi.org/10.1177/26339137261459441
