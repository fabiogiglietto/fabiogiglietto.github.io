- date: '2026-07-31'
  content: >-
    Published in Science Advances, a major new study investigates exposure to
    untrustworthy sources on Facebook and Instagram during the 2020 US election.
    The findings reveal concentrated exposure among specific user segments but
    show no measurable attitudinal effects on the audiences studied.
  url: https://doi.org/10.1126/sciadv.adz6502
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-22'
  content: >-
    A newly published longitudinal study in Information, Communication & Society
    examines affective engagement within pro-Bolsonaro Facebook networks.
    Co-authored by Fabio Giglietto, Giada Marino, and Bruna Paroni, the research
    analyzes partisan community dynamics to understand how emotional connections
    shape online political spaces over time.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
    Emerging methodological challenges are highlighted in a new paper analyzing
    researcher experiences within platform 'clean room' environments. The study
    provides crucial insights into the technical and institutional barriers
    currently facing digital media researchers trying to access platform data.
  url: https://doi.org/10.25358/openscience-15825
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    Critical questions surrounding platform-mediated research are explored in a
    new paper addressing the politics of API access. The work, titled 'Seeing
    like an API,' examines how platform infrastructures shape academic research
    agendas and the broader ecosystem of social data access.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
    - Mastodon
    - BlueSky
  toread: true
