- date: '2026-07-31'
  content: >-
    Highly concentrated exposure to untrustworthy sources on Facebook and
    Instagram during 2020 did not yield significant attitudinal changes,
    according to a major study published in Science Advances by Olivier
    Bergeron-Boutin and colleagues.
  url: https://aoir.social/@fabiogiglietto/117013532175857545
