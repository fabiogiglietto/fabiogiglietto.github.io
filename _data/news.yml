- date: '2026-07-31'
  content: >-
    The behavioral impacts of online misinformation are challenged in a new
    Science Advances study by Olivier Bergeron-Boutin and colleagues. Analyzing
    data from the 2020 US election, the researchers found that while exposure to
    untrustworthy sources on Facebook and Instagram was highly concentrated
    among a small subset of users, it did not produce measurable shifts in
    political attitudes.
  url: https://doi.org/10.1126/sciadv.adz6502
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-24'
  content: >-
    How do localized audience interpretations shape the impact of synthetic
    media? A new study by Morgan Wack and Stephen Prochaska analyzes
    AI-generated disinformation and deepfakes in Kenya, highlighting the
    critical role of cultural and regional contexts in how users make sense of
    manipulated digital content.
  url: https://doi.org/10.1177/20563051261462092
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-22'
  content: >-
    Published in Information, Communication & Society, a new longitudinal study
    examines how affective engagement drives partisan community dynamics within
    pro-Bolsonaro Facebook networks. Co-authored by Giada Marino, Bruna Paroni,
    and Fabio Giglietto, the research offers fresh methodology and empirical
    insights into the persistence of online political polarization.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
    An investigation by Patrícia Rossini, Camila Mont'Alverne, and Antonis
    Kalogeropoulos explores the relationship between digital informational
    pathways, misinformation, and public trust in election results, addressing
    key vulnerabilities in modern democratic systems.
  url: https://doi.org/10.1080/17457289.2026.2701896
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    The politics of social media research and data access are critically
    examined in a new paper by Zoë Natalia Cullen, Nicole B. Ellison, and Irene
    V. Pasquetto. The authors explore how platform-mediated API environments
    shape the structural and political boundaries of contemporary academic
    inquiry.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
