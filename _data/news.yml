- date: '2026-07-22'
  content: >-
    A new co-authored study published in Information, Communication & Society
    maps partisan community dynamics on social media. Together with Giada Marino
    and Bruna Paroni, a longitudinal analysis was conducted to track affective
    engagement within pro-Bolsonaro Facebook networks, shedding light on the
    long-term mechanics of online political polarization.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    Addressing the shifting landscape of digital research methods, a new paper
    in Big Data & Society examines 'the politics of access' in platform-mediated
    research. The authors analyze how API dependencies and infrastructure
    control shape contemporary academic inquiries into social media spaces.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-12'
  content: >-
    Can artificial intelligence change minds on contentious public issues?
    Experimental research indicates that conversational AI has the capacity to
    significantly shift beliefs and policy support, demonstrating persuasive
    capabilities even when interacting with highly skeptical audiences.
  url: https://doi.org/10.31234/osf.io/7szrn_v1
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-02'
  content: >-
    A critical evaluation of crowdsourced content moderation reveals potential
    electoral risks. Published in Science Advances, the study shows how systems
    like X's Community Notes may systematically undermoderate polarizing
    content, highlighting design-level vulnerabilities during democratic
    processes.
  url: https://doi.org/10.1126/sciadv.aee6932
  platforms:
    - Mastodon
    - BlueSky
  toread: true
