- date: '2026-07-22'
  content: >-
    Partisan community dynamics on social media are the focus of a new
    longitudinal study analyzing affective engagement within pro-Bolsonaro
    Facebook networks. Co-authored by Giada Marino, Bruna Paroni, and Fabio
    Giglietto, the paper explores how emotional resonance shapes online
    political mobilization over time.
  url: https://doi.org/10.1080/1369118x.2026.2696929
