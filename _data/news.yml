    The cultural and economic mechanisms driving "AI slop" are the focus of
    emerging critical research. Recent scholarly analyses explore the "gimmick"
    of generative culture and delve into the industrial-scale production of
    AI-generated viral short videos, mapping out how these low-quality formats
    impact digital ecosystems.
