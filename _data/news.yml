- date: '2026-07-22'
  content: >-
    A new co-authored longitudinal study investigates the dynamics of partisan
    communities online. The research analyzes affective engagement within
    pro-Bolsonaro Facebook networks over time, offering critical insights into
    how political polarization and digital spaces interact.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-08-16'
  content: >-
    Recent research shedding light on audience perceptions of artificial
    intelligence explores how users trust AI-generated news and search results.
    Selected papers investigate the impact of task-specific AI disclosures and
    how revealing the persuasive intent of chatbots can reduce their influence.
  url: https://doi.org/10.1177/02673231261473432
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-08-13'
  content: >-
    The rise of 'AI slop' and viral generative culture has become a focal point
    of recent academic inquiries. Newly highlighted studies explore the rapid
    production of viral, AI-generated short videos in China alongside critical
    theoretical perspectives on the broader implications of 'degenerative'
    generative AI.
  url: https://doi.org/10.1007/s00146-026-03254-9
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-08-17'
  content: >-
    Analyses of transnational far-right media networks highlight the complex
    pathways of online radicalization and hyperpartisan news. Key studies
    examine how far-right channels transition from national focus to global
    YouTube audiences, as well as the structural affordances of multi-platform
    networks in Germany.
  url: https://doi.org/10.1177/1329878x261474201
  platforms:
    - Mastodon
    - BlueSky
  toread: true
