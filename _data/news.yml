- date: '2026-11-17'
  content: >-
    New research in *Big Data & Society* introduces a conceptual framework for
    analyzing the social and cultural lifecycle of 'AI slop'—low-quality,
    mass-produced synthetic content. Complementary findings from arXiv highlight
    how user communities perceive and actively contest algorithmically amplified
    AI content in their feeds.
  url: https://doi.org/10.1177/20539517261506941
