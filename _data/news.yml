    - BlueSky
  toread: true
- date: '2026-07-28'
  content: >-
    New research investigates the relationship between alternative and
    mainstream media through an analysis of entity networks. The paper explores
    whether alternative outlets genuinely offer independent coverage or
    ultimately rely on mainstream news structures.
  url: https://doi.org/10.31235/osf.io/43nvp_v1
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-24'
  content: >-
    How audiences interpret deepfakes in Kenya is the focus of a newly published
    study on AI-generated disinformation. The authors examine how local
    interpretations and contextual factors ultimately mediate the impact and
    threat of synthetic media.
  url: https://doi.org/10.1177/20563051261462092
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    The shifting landscape of academic access to platform data is analyzed in a
    new paper on API-mediated research. The work critically examines the
    politics of data access and how platform-controlled interfaces shape the
    boundaries of digital social science.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
