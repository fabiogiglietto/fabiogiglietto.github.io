- date: '2026-07-22'
  content: >-
    A newly published longitudinal study in Information, Communication & Society
    investigates partisan community dynamics, specifically focusing on affective
    engagement within pro-Bolsonaro Facebook networks. Co-authored with Giada
    Marino and Bruna Paroni, the research provides critical insights into how
    online partisan groups sustain and grow their communities over time.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-08-16'
  content: >-
    Addressing the intersection of artificial intelligence and media trust, a
    newly released study by Giulia Sbaraini Fontes and Sergio Splendore examines
    what drives Italian audiences' perceptions of news and search engine results
    produced by AI, offering timely insights into public trust beyond simple
    algorithmic operations.
  url: https://doi.org/10.1177/02673231261473432
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-31'
  content: >-
    New research published in Science Advances analyzes the impact of
    untrustworthy content on Meta platforms during the 2020 election cycle,
    finding that while exposure to unreliable sources on Facebook and Instagram
    was highly concentrated, it did not lead to measurable shifts in political
    attitudes.
  url: https://doi.org/10.1126/sciadv.adz6502
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
    Essential reading for computational social scientists, a recent paper by
    Axel Bruns and Laura Vodden explores the practical, technical, and
    methodological challenges researchers face when working with platform data
    inside highly restricted 'clean room' environments.
  url: https://doi.org/10.25358/openscience-15825
