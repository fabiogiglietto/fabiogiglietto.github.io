- date: '2026-07-22'
  content: >-
    A new co-authored longitudinal study published in Information, Communication
    & Society examines partisan community dynamics by analyzing affective
    engagement in pro-Bolsonaro Facebook networks. The research, co-authored
    with Giada Marino and Bruna Paroni, maps how emotional engagement shapes
    partisan online spaces over time.
