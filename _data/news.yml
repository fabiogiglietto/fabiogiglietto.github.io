- date: '2026-07-22'
  content: >-
    A new longitudinal study published in Information, Communication & Society
    examines affective engagement within pro-Bolsonaro Facebook networks.
    Co-authored by Giada Marino, Bruna Paroni, and Fabio Giglietto, the paper
    details how partisan community dynamics and emotional polarization shift
    over time on social media platforms.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
