- date: '2026-07-31'
  content: >-
    New research published in Science Advances reveals that while exposure to
    untrustworthy sources on Facebook and Instagram during the 2020 US election
    was highly concentrated, it did not produce measurable attitudinal effects
    on users.
  url: https://doi.org/10.1126/sciadv.adz6502
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-22'
  content: >-
    A new longitudinal study examining affective engagement within pro-Bolsonaro
    Facebook networks has been published in Information, Communication &
    Society. Co-authored by Giada Marino, Bruna Paroni, and Fabio Giglietto, the
    paper traces how partisan communities sustain emotional involvement over
    time.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    A critical examination of how APIs shape modern academic inquiry has been
    published by Zoë Natalia Cullen, Nicole B. Ellison, and Irene V. Pasquetto.
    The paper investigates the complex politics of data access in
    platform-mediated social media research.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    Addressing the methodological challenges of video-based social media
    research, a new study by Kevin Zheng and colleagues introduces TubeStats and
    TokStats. These newly developed tools enable researchers to gather and
    analyze random samples from YouTube and TikTok.
  url: https://doi.org/10.17645/mac.12085
  platforms:
    - Mastodon
    - BlueSky
  toread: true
