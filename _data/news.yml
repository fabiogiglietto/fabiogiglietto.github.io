- date: '2026-08-16'
  content: >-
    Recent research addresses the dynamics of user trust and influence in AI
    systems. While Giulia Sbaraini Fontes and Sergio Splendore investigate
    Italian audiences' trust in AI-produced news and search results, Adrian
    Rauchfleisch and Andreas Jungherr demonstrate that disclosing the persuasive
    intent of AI chatbots significantly reduces their persuasive impact.
