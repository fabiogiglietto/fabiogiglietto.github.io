- date: '2026-08-13'
  content: >-
    The emerging cultural phenomenon of 'AI slop' is the focus of several new
    critical studies. Key publications by Jiaru Tang et al. and Idil Galip &
    Ludmila Lupinacci explore the mechanics of viral AI-generated short video
    production in China alongside the broader implications of 'degenerative AI'
    and 'brainrot' in modern generative culture.
  url: https://aoir.social/@fabiogiglietto/117086906410919334
