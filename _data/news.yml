- date: '2026-07-14'
  content: >-
    Emerging challenges in platform-mediated research are highlighted in a new
    paper by Zoë Natalia Cullen, Nicole B. Ellison, and Irene V. Pasquetto. The
    study, titled 'Seeing like an API,' critically explores the politics of data
    access and the limitations researchers face when navigating
    platform-controlled environments.
  url: https://aoir.social/@fabiogiglietto/116917508861533399
