- date: '2026-07-27'
  content: >-
    New research investigates how audiences perceive the trustworthiness of
    generative AI when presented with task-specific AI disclosures. The study
    highlights the complex relationship between platform transparency efforts
    and public skepticism regarding automated content generation.
  url: https://doi.org/10.1080/21670811.2026.2703599
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
