- date: '2026-11-03'
  content: >-
    Methods for detecting coordinated inauthentic behavior on social platforms
    face new scrutiny in a preprint by Iannucci, Matakos, and Kivelä. The
    authors reframe coordination detection as a statistical detectability
    problem, arguing that standard network clustering approaches often identify
    co-activity rather than true coordination.
