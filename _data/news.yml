- date: '2026-07-14'
  content: >-
    The politics of platform-mediated research are explored in a new paper
    addressing the constraints of API access for academic research. Published in
    Big Data & Society, the work discusses how relying on platform-controlled
    data interfaces reshapes the methodologies and agendas of social scientists.
  url: https://aoir.social/@fabiogiglietto/116917508861533399
