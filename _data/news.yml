- date: '2026-07-31'
  content: >-
    Exposure to untrustworthy information on social media during the 2020 US
    election is the focus of a significant study published in Science Advances.
    Led by Olivier Bergeron-Boutin, the research team reveals that while
    exposure to untrustworthy sources on Facebook and Instagram was highly
    concentrated among a small subset of users, it had no measurable effects on
    their political attitudes.
  url: https://doi.org/10.1126/sciadv.adz6502
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-22'
  content: >-
    A new longitudinal study co-authored by Giada Marino, Bruna Paroni, and
    Fabio Giglietto explores partisan community dynamics on social media.
    Published in Information, Communication & Society, the research analyzes
    affective engagement within pro-Bolsonaro Facebook networks to understand
    how political devotion and online community structures evolve over time.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    The politics of data access and platform-mediated research are under the
    microscope in a newly highlighted paper by Zoë Natalia Cullen, Nicole B.
    Ellison, and Irene V. Pasquetto. The study, titled 'Seeing like an API,'
    critically examines how platform APIs shape research agendas and the broader
    political implications of restricted academic access to social media data.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-08'
  content: >-
    How do weakening democracies grapple with emerging technologies? A
    comparative analysis by Gabrielle D. Beacken, Inga K. Trauthig, and Samuel
    C. Woolley investigates the intersection of generative AI, propaganda, and
    digital authoritarianism, offering crucial insights into how state and
    non-state actors leverage AI-generated content to influence public discourse
    across six vulnerable nations.
  url: https://doi.org/10.1177/20539517251410064
  platforms:
    - Mastodon
    - BlueSky
  toread: true
