    Researchers from the University of Urbino Carlo Bo are presenting ten
    research contributions at the Association of Internet Researchers conference
    (AoIR2026) in Mexico City. The presentations cover a wide range of topics,
    including personalized fandom in Italian feminist influ-activism and digital
    media dynamics.
