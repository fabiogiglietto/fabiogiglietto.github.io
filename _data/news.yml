- date: '2026-07-18'
  content: >-
    As academic access to social media data becomes increasingly restricted, a
    new paper by Axel Bruns and Laura Vodden highlights the distinct
    methodological and practical challenges of conducting research within
    platform-controlled 'clean room' environments.
