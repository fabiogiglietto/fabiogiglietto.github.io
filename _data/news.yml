  toread: true
- date: '2026-08-13'
  content: >-
    The cultural and production realities of 'AI slop' are gaining academic
    traction. Two recent papers examine this phenomenon: Jiaru Tang and
    co-authors investigate the production of viral, AI-generated short videos in
    China, while Idil Galip and Ludmila Lupinacci critically conceptualize
    'degenerative AI' and the gimmicks of modern generative culture.
  url: https://aoir.social/@fabiogiglietto/117086906410919334
