- date: '2026-08-07'
  content: >-
    The cultural implications of generative artificial intelligence are
    critically analyzed in a new paper addressing the social phenomena of 'AI
    slop,' 'brainrot,' and the gimmicks defining modern generative media
    production.
  url: https://doi.org/10.1177/13675494261468638
