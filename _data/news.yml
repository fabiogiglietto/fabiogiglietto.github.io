  content: >-
    A statistical detectability framework challenges conventional social media
    coordination detection methods (Iannucci et al., 2026). The study critiques
    standard approaches that project account co-activity into similarity
    networks, demonstrating how traditional clustering often identifies
    co-activation patterns regardless of whether genuine coordination exists.
