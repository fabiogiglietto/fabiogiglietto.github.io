- date: '2026-07-31'
  content: >-
    A newly released study in *Science Advances* investigates the impact of
    untrustworthy content on social media. Analyzing Facebook and Instagram data
    from 2020, Olivier Bergeron-Boutin and co-authors find that while exposure
    to untrustworthy sources is highly concentrated among certain users, it
    shows no measurable effects on their political attitudes.
