- date: '2026-10-02'
  content: >-
    Recent research demonstrates how commercial generative AI models can
    inadvertently transform far-right propaganda rather than neutralizing it.
    Through an experimental pipeline, the study shows that while AI systems
    successfully sanitize explicit hateful markers, they preserve underlying
    ideological biases through subtler aesthetic choices and visual cues.
