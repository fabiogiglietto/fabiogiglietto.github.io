- date: '2026-10-23'
  content: >-
    A study by Gary King and Stephen Worthington highlights a significant shift
    in scholarly evaluation, finding that AI-generated peer reviews consistently
    surpass high-quality human expert reviews across multiple quality metrics.
    The findings raise fundamental policy questions about the future role of
    artificial intelligence in academic publishing.
