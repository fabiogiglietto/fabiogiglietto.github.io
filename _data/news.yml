- date: '2026-10-23'
  content: >-
    Artificial intelligence tools may now rival or exceed top human expert
    reviews in academic publishing, per a new study comparing AI-generated
    article evaluations against high-standard human reviews chosen by journal
    editors. The findings explore the potential integration of AI into
    peer-review workflows alongside the broader policy implications for
    scholarly evaluation.
