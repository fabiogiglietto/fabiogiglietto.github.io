    A novel streaming pipeline published at ACM CIKM 2026 offers a system for
    predicting the virality of false narratives before they reach their peak. By
    clustering semantically similar posts and evaluating anomalous activity
    surges, the framework enables early triage for fact-checkers up to 23 hours
    ahead of maximum spread.
