- date: '2026-07-22'
  content: >-
    A newly published longitudinal study co-authored by Fabio Giglietto, Giada
    Marino, and Bruna Paroni investigates affective engagement within
    pro-Bolsonaro Facebook networks. The paper, appearing in Information,
    Communication & Society, measures partisan community dynamics to trace how
    emotional ties and social identity drive user interaction over time.
  url: https://doi.org/10.1080/1369118x.2026.2696929
