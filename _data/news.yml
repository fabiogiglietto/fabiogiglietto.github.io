- date: '2026-07-14'
  content: >-
    Navigating the politics of academic data access, a newly published paper in
    Big Data & Society examines 'platform-mediated research' through the lens of
    APIs. Authors Zoë Natalia Cullen, Nicole B. Ellison, and Irene V. Pasquetto
    explore how platform interfaces shape the boundaries of digital social
    science.
  url: https://aoir.social/@fabiogiglietto/116917508861533399
