- date: '2026-07-22'
  content: >-
    Newly published research introduces a longitudinal analysis of affective
    engagement in pro-Bolsonaro Facebook networks. The study, co-authored with
    Giada Marino and Bruna Paroni, tracks the shifting dynamics of partisan
    communities on social media platforms.
  url: https://doi.org/10.1080/1369118x.2026.2696929
