- date: '2026-07-18'
  content: >-
    As social media platforms increasingly restrict access to raw public data,
    research practices must adapt. New insights from Axel Bruns and Laura Vodden
    explore the critical methodological and practical hurdles researchers face
    when working with platform data within highly controlled "clean room"
    environments.
