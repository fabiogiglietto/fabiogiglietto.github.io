- date: '2026-11-17'
  content: >-
    A novel conceptual framework published in Big Data & Society proposes
    analyzing 'AI slop'—low-quality synthetic content—through social and
    cultural dynamics rather than treating it merely as digital pollution. The
    authors argue that automated detection tools cannot fully address the
    degradation of online credibility signals, calling instead for
    context-driven research into how users produce, consume, and resist
    mass-generated synthetic media.
