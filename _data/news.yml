- date: '2026-07-22'
  content: >-
    A newly published longitudinal study in Information, Communication & Society
    examines affective engagement within pro-Bolsonaro Facebook networks.
    Co-authored by Giada Marino, Bruna Paroni, and Fabio Giglietto, the paper
    maps out how partisan community dynamics and emotional connection evolve on
    social platforms over time.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-31'
  content: >-
    How does exposure to untrustworthy digital content affect political
    attitudes? A new study published in Science Advances by Olivier
    Bergeron-Boutin and colleagues investigates Facebook and Instagram activity
    during the 2020 US election, revealing that while exposure to untrustworthy
    sources was highly concentrated among a small group of users, it did not
    lead to measurable shifts in political attitudes.
  url: https://doi.org/10.1126/sciadv.adz6502
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
    Conducting academic research on social media platforms is facing
    unprecedented data barriers. In their new paper, Axel Bruns and Laura Vodden
    outline the methodology, practical hurdles, and systemic challenges that
    independent researchers face when trying to analyze platform data within
    highly restrictive "clean room" environments.
  url: https://doi.org/10.25358/openscience-15825
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    Scholars Zoë Natalia Cullen, Nicole B. Ellison, and Irene V. Pasquetto
    explore the shifting landscape of academic research in their new paper on
    platform-mediated data access. The work critically addresses "the politics
    of access" and analyzes how platform APIs shape, direct, and restrict the
    questions researchers are able to ask.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
    - Mastodon
    - BlueSky
  toread: true
