- date: '2026-07-22'
  content: >-
    A new longitudinal study co-authored with Giada Marino and Bruna Paroni
    investigates the affective dynamics within partisan Facebook networks.
    Focusing on pro-Bolsonaro communities, the research tracks how emotional
    engagement and community patterns evolve over time in highly polarized
    digital environments.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-27'
  content: >-
    How do audiences perceive the trustworthiness of generative AI? A newly
    highlighted paper by Nicolas Mattis, Kimon Kieslich, and Claes Holger de
    Vreese investigates audience reactions to task-specific AI disclosures,
    shedding light on the complexities of transparency and trust in the
    synthetic media era.
  url: https://doi.org/10.1080/21670811.2026.2703599
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-14'
  content: >-
    The politics of social media platform access and its impact on academic
    inquiry are explored in a featured paper by Zoë Natalia Cullen, Nicole B.
    Ellison, and Irene V. Pasquetto. The study offers a critical perspective on
    how API access shapes and limits platform-mediated research.
  url: https://doi.org/10.1177/20539517261461463
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-04'
  content: >-
    Strategic delegitimization in political discourse is the subject of a newly
    shared study focusing on Italian print media. Researchers Lorenzo Mosca and
    Fred Paxton analyze how newspapers weaponize the concept of 'fake news' to
    amplify certain narratives while discrediting opponents.
  url: https://doi.org/10.1177/02673231261458935
  platforms:
    - Mastodon
