- date: '2026-10-02'
  content: >-
    An experimental study in *Platforms & Society* by Crichton and Torres (2026)
    reveals how commercial generative AI models alter far-right propaganda. The
    research shows that while safety filters sanitize explicit hate symbols, AI
    systems frequently retain underlying ideological bias through subtle
    aesthetic and visual cues.
