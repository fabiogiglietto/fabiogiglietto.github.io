- date: '2026-11-18'
  content: >-
    Evidence from over 180 million Facebook users reveals that while unfriending
    is overall relatively rare, social media users disproportionately sever ties
    across political lines during major events like Election Day and January
    6th. Published in The Journal of Politics, the multi-author study
    demonstrates that politically engaged users and strong partisans drive the
    highest rates of cross-ideological friendship termination.
