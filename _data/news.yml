- date: '2026-07-22'
  content: >-
    How political devotion is sustained over time is the focus of a new
    longitudinal study analyzing affective engagement within pro-Bolsonaro
    Facebook networks. Co-authored with Giada Marino and Bruna Paroni, the
    research offers a deep dive into partisan community dynamics and the
    mechanisms of online engagement.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
    The politics of API access and the hurdles of working in platform 'clean
    room' environments are taking center stage in digital research methodology.
    Recent publications highlight the growing tension between platform-mediated
    research and independent academic access, shedding light on the critical
    infrastructure needed to study online ecosystems.
  url: https://doi.org/10.25358/openscience-15825
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
    Democratic trust is increasingly under pressure from digital informational
    pathways. A study by Patrícia Rossini, Camila Mont'Alverne, and Antonis
    Kalogeropoulos investigates how misinformation shapes and potentially erodes
    public trust in election outcomes, offering timely insights for electoral
    integrity.
  url: https://doi.org/10.1080/17457289.2026.2701896
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-12'
  content: >-
    New evidence suggests that conversational AI models are capable of shifting
    beliefs and policy support even among skeptics on contested social issues,
    highlighting the growing persuasive power of generative AI in digital public
    squares.
  url: https://doi.org/10.31234/osf.io/7szrn_v1
