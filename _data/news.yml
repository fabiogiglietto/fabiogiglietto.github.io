- date: '2026-11-02'
  content: >-
    Practical workflows for leveraging open-weight large language models to
    automate computational content analysis were introduced by Farjam et al.
    (2026) in Social Science Computer Review. By introducing a secondary 'Judge
    agent' to adjudicate conflicting codings, the method achieves coding
    reliability comparable to human expert performance on standard hardware.
