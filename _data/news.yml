- date: '2026-10-09'
  content: >-
    New theoretical work by Petter Törnberg and Justus Uitermark explores the
    societal transition from platform-mediated network effects to an 'AI
    society' driven by cognitive lock-in and corporate capital concentration.
    Published in Dialogues on Digital Society, the study analyzes how generative
    AI architectures reshape digital monopolies and state entanglement.
