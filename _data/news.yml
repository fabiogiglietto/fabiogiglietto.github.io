- date: '2026-07-22'
  content: >-
    Affective engagement in partisan online spaces is the focus of a new
    longitudinal study published in Information, Communication & Society.
    Co-authored by Giada Marino, Bruna Paroni, and Fabio Giglietto, the paper
    analyzes pro-Bolsonaro Facebook networks to measure the shifting dynamics of
    right-wing digital communities.
