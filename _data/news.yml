- date: '2026-07-22'
  content: >-
    A new longitudinal study published in *Information, Communication & Society*
    examines partisan community dynamics on Facebook. Co-authored with Giada
    Marino and Bruna Paroni, the research analyzes affective engagement within
    pro-Bolsonaro networks, offering insights into how political communities
    sustain engagement over time.
  url: https://aoir.social/@fabiogiglietto/116962866322739757
