- date: '2026-07-22'
  content: >-
    Partisan community dynamics on Facebook are the focus of a new longitudinal
    study co-authored by Giada Marino, Bruna Paroni, and Fabio Giglietto. The
    paper, which tracks pro-Bolsonaro networks, analyzes affective engagement to
    understand how online political groups develop and sustain themselves over
    time.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-08-16'
  content: >-
    How do audiences perceive AI-generated news? A recent study by Giulia
    Sbaraini Fontes and Sergio Splendore investigates what drives Italian
    audiences' trust and perceptions of search results and articles produced
    with artificial intelligence, moving beyond purely algorithmic trust
    factors.
  url: https://doi.org/10.1177/02673231261473432
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-08-18'
  content: >-
    Understanding coordinated inauthentic behavior online receives a major
    synthesis in a new survey paper by Lorenzo Mannocci and colleagues. The
    comprehensive study maps out current methodologies for detecting and
    characterizing coordinated activities across digital platforms.
  url: https://doi.org/10.1145/3839225
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-08-07'
  content: >-
    The cultural implications of generative AI are unpacked in a new critical
    article by Idil Galip and Ludmila Lupinacci. The work introduces concepts
    like 'AI slop' and 'brainrot' to analyze the aesthetic and systemic gimmicks
    defining contemporary generative culture.
  url: https://doi.org/10.1177/13675494261468638
  platforms:
    - Mastodon
    - BlueSky
  toread: true
