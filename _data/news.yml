- date: '2026-07-31'
  content: >-
    Newly released research in Science Advances explores exposure to
    untrustworthy sources on Facebook and Instagram during the 2020 US election.
    The study by Olivier Bergeron-Boutin and colleagues demonstrates that while
    exposure to misinformation was highly concentrated among a small group of
    users, it did not lead to measurable changes in political attitudes.
  url: https://aoir.social/@fabiogiglietto/117013532175857545
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-08-16'
  content: >-
    How audiences perceive AI-generated content is the focus of several recent
    studies highlighted in the field. A new paper by Giulia Sbaraini Fontes and
    Sergio Splendore investigates what drives Italian audiences' trust in
    AI-produced news and search results, while research by Nicolas Mattis and
    co-authors looks at the efficacy of task-specific AI disclosures on public
    trust.
  url: https://aoir.social/@fabiogiglietto/117103952211476750
  platforms:
