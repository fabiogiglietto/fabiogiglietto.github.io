  content: >-
    Analysis by Törnberg and Uitermark (2026) in Dialogues on Digital Society
    theorizes the transition from the platform society to an 'AI society.' The
    authors argue that generative AI systems foster cognitive lock-in through
    interaction histories, shifting market dominance toward heavily capitalized
    state-entangled corporations.
