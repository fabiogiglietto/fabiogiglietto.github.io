- date: '2026-07-22'
  content: >-
    A new longitudinal study co-authored by Fabio Giglietto, Giada Marino, and
    Bruna Paroni investigates the dynamics of partisan communities on social
    media. Published in Information, Communication & Society, the research
    analyzes affective engagement within pro-Bolsonaro Facebook networks to
    understand how political devotions and network structures are sustained over
    time.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-27'
  content: >-
    How audiences perceive generative AI and interpret synthetic media remains a
    critical area of investigation as artificial intelligence becomes more
    integrated into the information ecosystem. Recent papers explore this
    landscape, including an investigation by Nicolas Mattis, Kimon Kieslich, and
    Claes Holger de Vreese into how task-specific AI disclosures shape
    trustworthiness, alongside work by Morgan Wack and Stephen Prochaska
    examining how audience interpretations influence the impact of deepfakes in
    Kenya.
  url: https://doi.org/10.1080/21670811.2026.2703599
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-18'
  content: >-
    Navigating the complexities of platform-mediated research continues to
    challenge digital media scholars. New methodological publications address
    these hurdles, focusing on Axel Bruns and Laura Vodden's exploration of the
    difficulties in working with platform data from clean room environments, as
    well as an analysis of the politics of API access by Zoë Natalia Cullen,
    Nicole B. Ellison, and Irene V. Pasquetto.
  url: https://doi.org/10.25358/openscience-15825
  platforms:
    - Mastodon
    - BlueSky
  toread: true
- date: '2026-07-24'
  content: >-
    The multi-faceted nature of global political polarization and digital
    influence is the subject of several new research contributions. A study by
    Max Falkenberg et al. advocates for a more integrated and globally equitable
    understanding of polarization, complemented by Gregory Eady et al.'s work on
    mapping the ideological alignment of news media, politicians, and the public
    through social media sharing.
  url: >-
    https://scholar.google.com/scholar?q=Toward%20an%20integrated%20and%20globally%20equitable%20understanding%20of%20political%20polarization
  platforms:
    - Mastodon
