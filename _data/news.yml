- date: '2026-07-18'
  content: >-
    Methodological developments and structural hurdles in platform-mediated
    research are explored in a series of recent academic works. Curated updates
    highlight the challenges of accessing platform data within clean room
    environments, the political dynamics of API access, and the introduction of
    new academic sampling tools like TubeStats and TokStats for YouTube and
    TikTok.
  url: https://aoir.social/@fabiogiglietto/116939450343343743
