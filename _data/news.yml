  content: >-
    A longitudinal analysis of affective engagement within partisan Facebook
    networks has been published in a new co-authored study. Focusing on
    pro-Bolsonaro communities in Brazil, the research by Giada Marino, Bruna
    Paroni, and Fabio Giglietto measures how group dynamics and user engagement
    evolve over time, offering fresh insights into the mechanics of digital
    political polarization.
