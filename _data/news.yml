  content: >-
    A new survey launched by CheckFirst and the European Fact-Checking Standards
    Network (EFCSN) is gathering insights from the information integrity
    community. Open to researchers, fact-checkers, and civil society
    organizations until September 18, the initiative aims to identify key
    operational challenges and the resources needed to strengthen efforts
    against disinformation.
