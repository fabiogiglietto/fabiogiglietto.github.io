- date: '2026-07-22'
  content: >-
    New co-authored research published in Information, Communication & Society
    examines partisan community dynamics online. The longitudinal study analyzes
    affective engagement within pro-Bolsonaro Facebook networks, tracing
    patterns of political mobilization and digital interaction over time.
  url: https://doi.org/10.1080/1369118x.2026.2696929
  platforms:
